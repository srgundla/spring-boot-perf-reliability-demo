events {}

http {
    # Docker's embedded DNS. Short TTL = new replicas are picked up within seconds.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8080;

        # /catalog/api/products/1  ->  catalog:8081/api/products/1
        location /catalog/ {
            set $upstream http://catalog:8081;
            rewrite ^/catalog/(.*)$ /$1 break;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            add_header X-Served-By $upstream_addr always;
        }

        # /orders/api/orders  ->  orders:8082/api/orders
        location /orders/ {
            set $upstream http://orders:8082;
            rewrite ^/orders/(.*)$ /$1 break;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            add_header X-Served-By $upstream_addr always;
        }
    }
}
