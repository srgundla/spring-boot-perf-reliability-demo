# catalog-service: the same service as in compose.yaml, expressed the Kubernetes way.
# Shows the cloud-native contract: config from env, health probes, resource limits, graceful shutdown, autoscaling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels: {app: catalog-service}
spec:
  replicas: 2
  selector:
    matchLabels: {app: catalog-service}
  template:
    metadata:
      labels: {app: catalog-service}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      terminationGracePeriodSeconds: 30     # > spring.lifecycle.timeout-per-shutdown-phase (20s)
      containers:
        - name: catalog-service
          image: registry.example.com/catalog-service:1.0.0
          ports:
            - containerPort: 8081
          env:
            - {name: DB_URL, value: "jdbc:postgresql://postgres:5432/catalog"}
            - {name: DB_USER, valueFrom: {secretKeyRef: {name: demo-db, key: username}}}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: demo-db, key: password}}}
            - {name: REDIS_HOST, value: redis}
            - {name: OTLP_TRACES_URL, value: "http://otel-collector:4318/v1/traces"}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits:   {cpu: "1",  memory: 768Mi}
          startupProbe:                      # gives Flyway + JPA time to start without killing the pod
            httpGet: {path: /actuator/health/liveness, port: 8081}
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:                     # "restart me if I am wedged"
            httpGet: {path: /actuator/health/liveness, port: 8081}
            periodSeconds: 10
          readinessProbe:                    # "send me traffic only when dependencies are OK"
            httpGet: {path: /actuator/health/readiness, port: 8081}
            periodSeconds: 5
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}   # let the endpoint list update before SIGTERM drains requests
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  selector: {app: catalog-service}
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-service
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: catalog-service}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-service
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: catalog-service}
