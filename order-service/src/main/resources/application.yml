spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS:true}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:demo}
    password: ${DB_PASSWORD:demo}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        generate_statistics: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8082
  shutdown: graceful

demo:
  catalog:
    base-url: ${CATALOG_URL:http://localhost:8081}
    connect-timeout-ms: 300
    read-timeout-ms: 800

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_URL:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
